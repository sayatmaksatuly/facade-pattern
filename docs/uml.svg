<text x="1060.0" y="1259" text-anchor="middle" class="stereo">&#171;technical infrastructure&#187;</text>
<text x="1060.0" y="1283" text-anchor="middle" class="name">Database</text>
<path d="M775 1291 H1345" stroke="#a6afba"/>
<text x="786" y="1310" class="member">+ transaction(SqlWork&lt;T&gt;) : T</text>
<text x="786" y="1327" class="member">+ close()</text>
<text x="786" y="1344" class="member">JDBC Connection, SQLite file</text>
<text x="786" y="1361" class="member">one transaction per gateway operation</text>
<text x="60" y="1420" class="member">Solid arrow: stored collaborator association. Dashed arrow: use or create dependency. Arrow points to the dependency.</text>
<text x="60" y="1447" class="member">Each subsystem has four top-level classes and a nested entity Status enum. No subsystem depends on another subsystem.</text>
<text x="60" y="1474" class="member">Supporting value types: ParkingRequest, Workflow, WorkflowState, WorkflowEvent. DomainException and StoreException are technical exceptions.</text>
